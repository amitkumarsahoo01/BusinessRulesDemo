services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dmn_rules
      POSTGRES_USER: dmn_rules
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmn_rules}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmn_rules -d dmn_rules"]
      interval: 5s
      timeout: 5s
      retries: 10

  decision-service:
    build:
      context: ..
      dockerfile: decision-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dmn_rules
      SPRING_DATASOURCE_USERNAME: dmn_rules
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dmn_rules}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dmn_rules
      SPRING_DATASOURCE_USERNAME: dmn_rules
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dmn_rules}
      DECISION_SERVICE_URL: http://decision-service:8080
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      decision-service:
        condition: service_started
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      - decision-service
      - ai-service
    ports:
      - "80:80"

volumes:
  postgres-data:
