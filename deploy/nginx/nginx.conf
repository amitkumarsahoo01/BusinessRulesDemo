# Protects the AI endpoint (and the API key it spends) on a public demo: 10 requests/minute per
# client IP, with a small burst allowance for the chat UI's own retries/streaming reconnects.
limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ai/ {
        limit_req zone=ai_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://ai-service:8081/api/ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://decision-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
