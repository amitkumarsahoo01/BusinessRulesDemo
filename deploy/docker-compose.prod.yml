services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dmn_rules
      POSTGRES_USER: dmn_rules
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmn_rules}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmn_rules -d dmn_rules"]
      interval: 5s
      timeout: 5s
      retries: 10

  decision-service:
    build:
      context: ..
      dockerfile: decision-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dmn_rules
      SPRING_DATASOURCE_USERNAME: dmn_rules
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dmn_rules}
      RESET_DEMO_ON_START: ${RESET_DEMO_ON_START:-true}
      # Admin console account password and session-token signing secret (blank = random per start).
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      # Password for the 'api-client' integration account (HTTP Basic). Blank = random, printed once in the log.
      API_CLIENT_PASSWORD: ${API_CLIENT_PASSWORD:-}
      # ai-service's own credential for this API; must be the same value on both services.
      AI_SERVICE_PASSWORD: ${AI_SERVICE_PASSWORD:?Set AI_SERVICE_PASSWORD in deploy/.env (any long random string)}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    build:
      context: ..
      dockerfile: ai-service/Dockerfile
    # Lets the admin console point Ollama at the Docker host (Docker Desktop has this built in; Linux needs it).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dmn_rules
      SPRING_DATASOURCE_USERNAME: dmn_rules
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dmn_rules}
      DECISION_SERVICE_URL: http://decision-service:8080
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_MODEL: ${AI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_SERVICE_PASSWORD: ${AI_SERVICE_PASSWORD:?Set AI_SERVICE_PASSWORD in deploy/.env (any long random string)}
      RESET_DEMO_ON_START: ${RESET_DEMO_ON_START:-true}
    depends_on:
      postgres:
        condition: service_healthy
      decision-service:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    depends_on:
      - decision-service
      - ai-service
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
