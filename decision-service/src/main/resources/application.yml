server:
  # ${PORT} is injected by Cloud Run (always 8080 there in practice, but the platform owns the
  # value, not us); the literal default keeps docker-compose/local behavior unchanged everywhere
  # else since PORT is never set there.
  port: ${PORT:8080}

spring:
  application:
    name: decision-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dmn_rules}
    username: ${SPRING_DATASOURCE_USERNAME:dmn_rules}
    password: ${SPRING_DATASOURCE_PASSWORD:dmn_rules}
  flyway:
    enabled: true
  servlet:
    multipart:
      # DMN files are small text; this bounds the in-memory read in ModelsController.importDmn.
      max-file-size: 2MB
      max-request-size: 2MB

demo:
  seed:
    enabled: ${RESET_DEMO_ON_START:true}
  auth:
    # HMAC secret for session tokens. Blank = random per process (fine for one local instance).
    token-secret: ${AUTH_TOKEN_SECRET:}
    token-ttl: PT12H
    # Password for the 'admin' account (admin console). Blank = random, logged once at startup.
    admin-password: ${DEMO_ADMIN_PASSWORD:}
    # 'api-client' account for integrations using HTTP Basic auth. Blank = random, logged once.
    api-client-password: ${API_CLIENT_PASSWORD:}
    # 'ai-service' internal account; must equal ai-service's AI_SERVICE_PASSWORD.
    service-password: ${AI_SERVICE_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
