@if (auth.isLoggedIn()) {
  <div class="app-shell">
    <header class="app-header">
      <span class="app-title">{{ title }}</span>
      <nav class="app-nav">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/rules" routerLinkActive="active">Rules</a>
        <a routerLink="/audit" routerLinkActive="active">Audit</a>
        <a routerLink="/help" routerLinkActive="active">Help</a>
        @if (auth.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="active" class="admin-link">Admin</a>
        }
      </nav>
      <div class="app-user">
        <span class="user-name">{{ auth.currentUser()?.displayName }}</span>
        <span class="user-role">{{ auth.currentUser()?.role }}</span>
        <button type="button" class="logout" (click)="logout()">Sign out</button>
      </div>
    </header>
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
    <app-ask-bob />
  </div>
} @else {
  <router-outlet></router-outlet>
}
