@if (auth.isLoggedIn()) {
  <div class="app-shell">
    <header class="app-header">
      <span class="app-title">{{ title }}</span>
      <nav class="app-nav">
        <a routerLink="/rules" routerLinkActive="active">Rules</a>
        <a routerLink="/ask-ai" routerLinkActive="active">Ask AI</a>
        <a routerLink="/audit" routerLinkActive="active">Audit</a>
      </nav>
      <div class="app-user">
        <span class="user-name">{{ auth.currentUser()?.displayName }}</span>
        <span class="user-role">{{ auth.currentUser()?.role }}</span>
        <button type="button" class="logout" (click)="logout()">Sign out</button>
      </div>
    </header>
    <main class="app-content">
      <router-outlet></router-outlet>
    </main>
  </div>
} @else {
  <router-outlet></router-outlet>
}
